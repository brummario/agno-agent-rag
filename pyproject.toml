[project]
name = "agno-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mario Lucio de Araujo Brum", email = "mario.brum@serpro.gov.br" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.12",
    "chonkie[semantic]>=1.7.0",
    "chromadb>=1.5.9",
    "croniter>=6.2.4",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "groq>=1.7.0",
    "openai>=3.43.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
agno-agents = "agno_agents:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
